name: CI

# Runs on every push and pull request. Tests against an isolated MySQL service
# container — the production database is NEVER touched here.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard against destructive Artisan commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail the build if anyone ever introduces a destructive Artisan command
      # (migrate:refresh, rollback, reset, fresh, db:wipe) into the deploy
      # workflow, scripts/, deploy/, or Makefile. The production database has
      # thousands of property + order rows and must only ever be migrated
      # FORWARD.
      - name: Scan for forbidden commands
        run: |
          set -e
          PATTERN='migrate:(refresh|rollback|reset|fresh)|db:wipe'
          MATCHED=$(grep -RIEn "$PATTERN" \
            .github/workflows scripts deploy Makefile 2>/dev/null \
            | grep -v 'CI guard' || true)
          if [ -n "$MATCHED" ]; then
            echo "::error::Destructive Artisan command detected in deployment scripts:"
            echo "$MATCHED"
            exit 1
          fi
          echo "OK — no destructive Artisan commands found."

  test:
    name: PHP ${{ matrix.php }} — tests
    needs: guard
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dproperty_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, gd, intl, bcmath, zip, exif, curl, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare .env for testing
        run: |
          cp .env.example .env
          sed -i 's|^APP_ENV=.*|APP_ENV=testing|' .env
          sed -i 's|^APP_DEBUG=.*|APP_DEBUG=true|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=dproperty_test|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=root|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=root|' .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL never became ready"
          exit 1

      # Forward-only migrations on the ISOLATED test database. Never refresh
      # or rollback — same rule the production deploy enforces, so CI matches
      # prod behaviour.
      - name: Run migrations on the test database
        run: php artisan migrate --force

      - name: Build front-end assets
        run: npm run build

      - name: Run the test suite
        run: php artisan test --parallel || php artisan test

      - name: Check formatting (Pint, non-blocking)
        run: vendor/bin/pint --test || true
